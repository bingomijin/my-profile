<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로필 & 여행 기록</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse CDN for parsing CSV from Google Sheets -->
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-amber-50/50 min-h-screen flex items-center justify-center p-4 md:p-8 text-stone-800">

    <!-- 반응형 그리드 레이아웃: 데스크톱 가로 배치, 모바일 세로 배치 -->
    <div class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-12 gap-6 items-start">

        <!-- 1. 프로필 카드 (좌측 영역) -->
        <main class="md:col-span-5 lg:col-span-4 bg-white rounded-3xl shadow-xl shadow-amber-900/5 border border-amber-100 p-6 text-center transition-all md:sticky md:top-8">
            
            <!-- 프로필 사진 -->
            <div class="mb-5 flex justify-center">
                <div class="relative w-36 h-36 md:w-40 md:h-40 rounded-full overflow-hidden ring-4 ring-amber-200/60 shadow-md bg-stone-100">
                    <img 
                        id="profile-image"
                        src="profile_2.png" 
                        alt="프로필 사진" 
                        class="w-full h-full object-cover"
                        onerror="this.onerror=null; this.src='profile.png';"
                    />
                </div>
            </div>

            <!-- 이름 -->
            <h1 id="profile-name" class="text-2xl font-bold text-stone-900 mb-1">
                김미진
            </h1>

            <!-- 한 줄 소개 -->
            <p id="profile-tagline" class="text-amber-800 font-medium text-sm mb-5 bg-amber-50 inline-block px-3 py-1 rounded-full border border-amber-200/50">
                디지털라이프코치
            </p>

            <!-- 자기소개 -->
            <div id="profile-bio" class="text-stone-600 text-sm leading-relaxed border-t border-stone-100 pt-5 text-center">
                <p>
                    안녕하세요. 반갑습니다.
                </p>
            </div>

        </main>

        <!-- 2. 나의 여행 기록 영역 (우측 영역) -->
        <section class="md:col-span-7 lg:col-span-8 bg-white rounded-3xl shadow-xl shadow-amber-900/5 border border-amber-100 p-6 transition-all">
            <div class="flex items-center justify-between mb-4 pb-3 border-b border-stone-100 flex-wrap gap-2">
                <h2 class="text-lg font-bold text-stone-900 flex items-center gap-2">
                    <span>나의 여행 기록</span>
                    <span class="text-xs font-normal text-amber-800 bg-amber-50 px-2.5 py-1 rounded-full border border-amber-200/50">Travel Notes</span>
                </h2>
                
                <!-- 구글 시트 연동 토글 버튼 -->
                <button id="toggle-sheet-btn" onclick="toggleSheetPanel()" class="text-xs text-amber-800 hover:text-amber-900 bg-amber-100/60 hover:bg-amber-100 px-3 py-1.5 rounded-lg border border-amber-200 transition-colors flex items-center gap-1 font-medium">
                    <span>📊 구글 시트 연동</span>
                </button>
            </div>

            <!-- 구글 시트 URL 입력 패널 (기본 숨김) -->
            <div id="sheet-panel" class="hidden mb-5 p-4 bg-amber-50/70 rounded-2xl border border-amber-200/80 text-xs text-stone-700">
                <div class="flex justify-between items-center mb-2">
                    <label for="sheet-url" class="font-semibold text-stone-900">구글 스프레드시트 URL 입력</label>
                    <span class="text-[11px] text-stone-500">* '프로필', '여행' 시트 탭 공개 설정 필요</span>
                </div>
                <div class="flex gap-2">
                    <input 
                        type="url" 
                        id="sheet-url" 
                        placeholder="https://docs.google.com/spreadsheets/d/시트ID/edit..." 
                        class="flex-1 px-3 py-2 rounded-xl border border-stone-200 focus:outline-none focus:ring-2 focus:ring-amber-400 bg-white text-xs"
                    />
                    <button onclick="syncGoogleSheet()" class="bg-amber-600 hover:bg-amber-700 text-white font-medium px-4 py-2 rounded-xl transition-colors shrink-0">
                        연동하기
                    </button>
                </div>
                <div id="sync-status" class="mt-2 text-[11px] font-medium hidden"></div>
            </div>

            <!-- 여행 기록 카드 그리드 -->
            <div id="travel-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                <!-- 샘플 로딩 혹은 데이터가 여기에 동적으로 들어갑니다 -->
            </div>
        </section>

    </div>

    <script>
        // 기본 샘플 데이터 (시트 연동 전 기본 표시용)
        const defaultTravelData = [
            { date: '2024.05', place: '제주도', story: '푸른 바다와 함께한 제주 산책', image: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=300&q=80' },
            { date: '2023.11', place: '일본 교토', story: '고즈넉한 골목길 둘러보기', image: 'https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=300&q=80' },
            { date: '2023.08', place: '강원도 평창', story: '푸른 초원에서의 힐링', image: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=300&q=80' },
            { date: '2022.10', place: '경남 남해', story: '노을이 아름다웠던 바닷가', image: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=300&q=80' }
        ];

        // 연동 패널 토글
        function toggleSheetPanel() {
            const panel = document.getElementById('sheet-panel');
            panel.classList.toggle('hidden');
        }

        // 프로필 정보 동적 렌더링 함수
        function renderProfileData(dataList) {
            if (!dataList || dataList.length === 0) return;
            const profile = dataList[0];

            if (profile.name) {
                document.getElementById('profile-name').textContent = profile.name;
            }
            if (profile.tagline) {
                document.getElementById('profile-tagline').textContent = profile.tagline;
            }
            if (profile.bio) {
                document.getElementById('profile-bio').innerHTML = `<p>${profile.bio.replace(/\n/g, '<br>')}</p>`;
            }
            if (profile.image) {
                document.getElementById('profile-image').src = profile.image;
            }
        }

        // 여행 카드 동적 렌더링 함수
        function renderTravelCards(dataList) {
            const grid = document.getElementById('travel-grid');
            grid.innerHTML = '';

            if (!dataList || dataList.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-8 text-center text-xs text-stone-400">
                        기록된 여행 정보가 없습니다.
                    </div>
                `;
                return;
            }

            dataList.forEach(item => {
                const date = item.date || '날짜 미상';
                const place = item.place || '장소 미상';
                const story = item.story || '';
                const image = item.image || 'https://placehold.co/300x200/f5f5f4/78716c?text=Travel';

                const cardHtml = `
                    <div class="bg-stone-50/80 rounded-2xl p-3 border border-stone-100 flex flex-col justify-between">
                        <img 
                            src="${image}" 
                            alt="${place}" 
                            class="w-full h-28 rounded-xl object-cover bg-stone-200 mb-2.5"
                            onerror="this.onerror=null; this.src='https://placehold.co/300x200/f5f5f4/78716c?text=${encodeURIComponent(place)}';"
                        />
                        <div class="text-left flex-1 min-w-0">
                            <div class="flex items-center justify-between text-xs text-amber-800 font-medium mb-1">
                                <span>${date}</span>
                                <span class="text-stone-400 text-[11px]">${place}</span>
                            </div>
                            <h3 class="font-semibold text-stone-800 text-sm truncate mb-0.5">${story}</h3>
                        </div>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        // 구글 시트 URL에서 Spreadsheet ID 추출
        function extractSheetId(inputUrl) {
            if (!inputUrl) return null;
            const match = inputUrl.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
            return match ? match[1] : null;
        }

        // 상태 메시지 표시
        function showStatus(message, isError = false) {
            const statusEl = document.getElementById('sync-status');
            statusEl.classList.remove('hidden', 'text-emerald-600', 'text-rose-600');
            statusEl.classList.add(isError ? 'text-rose-600' : 'text-emerald-600');
            statusEl.textContent = message;
        }

        // 구글 시트 동기화 실행 (프로필 및 여행 시트 2개 연동)
        async function syncGoogleSheet() {
            const urlInput = document.getElementById('sheet-url').value.trim();
            
            if (!urlInput) {
                showStatus('구글 시트 URL을 입력해 주세요.', true);
                return;
            }

            const sheetId = extractSheetId(urlInput);
            if (!sheetId) {
                showStatus('올바른 구글 스프레드시트 URL 형식이 아닙니다.', true);
                return;
            }

            showStatus('구글 시트의 "프로필" 및 "여행" 데이터를 불러오는 중...');

            // '프로필' 시트 및 '여행' 시트 CSV URL 생성
            const profileCsvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent('프로필')}`;
            const travelCsvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent('여행')}`;

            let profileUpdated = false;
            let travelUpdated = false;

            // 1. '프로필' 시트 불러오기 및 반영
            try {
                const pRes = await fetch(profileCsvUrl);
                if (pRes.ok) {
                    const pCsv = await pRes.text();
                    Papa.parse(pCsv, {
                        header: true,
                        skipEmptyLines: true,
                        complete: function(results) {
                            if (results.data && results.data.length > 0) {
                                renderProfileData(results.data);
                                profileUpdated = true;
                            }
                        }
                    });
                }
            } catch (err) {
                console.warn('프로필 시트 불러오기 실패:', err);
            }

            // 2. '여행' 시트 불러오기 및 반영
            try {
                const tRes = await fetch(travelCsvUrl);
                if (tRes.ok) {
                    const tCsv = await tRes.text();
                    Papa.parse(tCsv, {
                        header: true,
                        skipEmptyLines: true,
                        complete: function(results) {
                            if (results.data && results.data.length > 0) {
                                renderTravelCards(results.data);
                                travelUpdated = true;
                            }
                        }
                    });
                }
            } catch (err) {
                console.warn('여행 시트 불러오기 실패:', err);
            }

            // 연동 결과 안내
            setTimeout(() => {
                if (profileUpdated || travelUpdated) {
                    const successList = [];
                    if (profileUpdated) successList.push('프로필');
                    if (travelUpdated) successList.push('여행');
                    showStatus(`✓ 성공적으로 연동되었습니다! (${successList.join(', ')} 시트)`);
                } else {
                    showStatus('데이터를 불러오지 못했습니다. 시트 탭 이름("프로필", "여행")과 공유 설정(링크 공개)을 확인해 주세요.', true);
                }
            }, 600);
        }

        // 페이지 진입 시 기본 데이터 렌더링
        window.addEventListener('DOMContentLoaded', () => {
            renderTravelCards(defaultTravelData);
        });
    </script>
</body>
</html>
